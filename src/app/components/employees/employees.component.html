<div class="container py-3 mt-3">
  <div class="d-flex justify-content-end mb-4">
    <button class="btn btn-primary">
      + Add Employee
    </button>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error" class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>FIRSTNAME</th>
        <th>LASTNAME</th>
        <th>DEPARTMENTS</th>
        <th class="text-center">ACTIONS</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let emp of employees">
        <td class="text-center">{{ emp.id }}</td>
        <td class="text-center">{{ emp.nameFirst }}</td>
        <td class="text-center">{{ emp.nameLast }}</td>
        <td class="text-center">
          {{ getDepartmentNames(emp.departments) }}
        </td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-secondary me-2">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" (click)="onDelete(emp.id)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
