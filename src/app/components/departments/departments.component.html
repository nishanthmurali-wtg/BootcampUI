<div class="container py-3 mt-3">
  <div class="d-flex justify-content-end mb-4">
    <button class="btn btn-primary">+ Add Department</button>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="!loading && !error" class="table-responsive">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>NAME</th>
        <th>READONLY</th>
        <th>MANDATORY</th>
        <th class="text-center">ACTION</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let d of departments">
        <td class="text-center">{{ d.id }}</td>
        <td>{{ d.name }}</td>
        <td class="text-center">
          <i class="bi" [ngClass]="d.readonly ? 'bi-check-lg text-success' : 'bi-x-lg text-danger'"></i>
        </td>
        <td class="text-center">
          <i class="bi" [ngClass]="d.mandatory ? 'bi-check-lg text-success' : 'bi-x-lg text-danger'"></i>
        </td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-secondary me-2">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" (click)="onDelete(d.id)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
