<div class="container py-3 mt-3">
  <div class="d-flex justify-content-center mb-4">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#DepartmentModal" (click)="openModal()">+ Add Department</button>
  </div>
  <div class="modal" id="DepartmentModal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Add New Department</h4>
          <button type="button" class="btn-close" (click)="closeModal()" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Department Name</label>
            <input type="text" class="form-control" [(ngModel)]="newDeptName">
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" [(ngModel)]="newDeptReadonly" id="readonlyCheck">
            <label class="form-check-label" for="readonlyCheck">Readonly</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" [(ngModel)]="newDeptMandatory" id="mandatoryCheck">
            <label class="form-check-label" for="mandatoryCheck">Mandatory</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal" (click)="onSave()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div *ngIf="!loading && !error" class="table-responsive d-flex justify-content-center">
    <table class="table table-bordered table-hover align-middle">
      <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>NAME</th>
        <th>READONLY</th>
        <th>MANDATORY</th>
        <th class="text-center">ACTION</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let d of departments">
        <td class="text-center">{{ d.id }}</td>
        <td>{{ d.name }}</td>
        <td class="text-center">
          <i class="bi" [ngClass]="d.readonly ? 'bi-check-lg text-success' : 'bi-x-lg text-danger'"></i>
        </td>
        <td class="text-center">
          <i class="bi" [ngClass]="d.mandatory ? 'bi-check-lg text-success' : 'bi-x-lg text-danger'"></i>
        </td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-secondary me-2">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" (click)="onDelete(d.id)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
